services:
  reachai:
    build:
      context: .
    platform: linux/amd64
    ports:
      - "3111:3111"
    volumes:
      - reachai_data:/app/reachai-backend/data
      - iii_home:/home/node/.iii
    env_file: .env
    environment:
      - RUST_LOG=info
    stop_signal: SIGINT
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  reachai_data:
  iii_home:
