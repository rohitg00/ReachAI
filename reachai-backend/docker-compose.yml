# iii project docker-compose — generated by `iii project generate-docker`, adapted for ReachAI.
services:
  iii:
    build:
      context: .
    ports:
      - "49134:49134"  # WebSocket (worker connections)
      - "3111:3111"    # REST API (the ReachAI HTTP routes live here)
      - "3112:3112"    # Stream API
      - "9464:9464"    # Prometheus metrics
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - iii_data:/app/data
      - iii_config:/app/config
    env_file: .env
    environment:
      - RUST_LOG=info
      - III_EXECUTION_CONTEXT=docker
    restart: unless-stopped

volumes:
  iii_data:
  iii_config:
