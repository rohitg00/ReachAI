namespace: reachai
startup_timeout: 5m
stop_timeout: 10s

engine:
  url: ws://127.0.0.1:49134

containers:
  state:
    worker: package://api.workers.iii.dev/state
    version: "0.22.2"
    config_name: state
    config_override:
      adapter:
        name: kv
        config:
          store_method: file_based
          file_path: ./data/state_store.db

  http:
    worker: package://api.workers.iii.dev/http
    version: "0.21.4"
    config_name: http
    config_override:
      host: 0.0.0.0
      port: 3111

  pubsub:
    worker: package://api.workers.iii.dev/pubsub
    version: "0.21.3-rc.2"

  queue:
    worker: package://api.workers.iii.dev/queue
    version: "0.21.6"

  reachai-backend:
    worker: path://.
    start_after: [state, http, pubsub, queue]
    env_file: [.env]
    scripts:
      pre_run: npm install
      run: node src/index.js
