namespace: reachai
startup_timeout: 5m
stop_timeout: 10s

engine:
  url: ws://127.0.0.1:49134

containers:
  state:
    worker: package://api.workers.iii.dev/state
    version: "0.22.6"
    config_name: state
    config_override:
      adapter:
        name: kv
        config:
          store_method: file_based
          file_path: ./data/state_store.db

  http:
    worker: package://api.workers.iii.dev/http
    version: "0.21.7"
    config_name: http
    config_override:
      host: 0.0.0.0
      port: 3111

  queue:
    worker: package://api.workers.iii.dev/queue
    version: "0.21.9"

  email:
    worker: package://api.workers.iii.dev/email
    version: "0.1.9"
    config_name: email
    config_override:
      accounts:
        notifications:
          provider: smtp
          from: "ReachAI <noreply@reachaiapp.online>"
          smtp:
            host: smtp.resend.com
            port: 587
            starttls: true
            username: resend
            password: ${RESEND_API_KEY}
        support:
          provider: smtp
          from: "ReachAI Support <support@reachaiapp.online>"
          smtp:
            host: smtp.resend.com
            port: 587
            starttls: true
            username: resend
            password: ${RESEND_API_KEY}

  reachai-backend:
    worker: path://.
    start_after: [state, http, queue, email]
    env_file: [.env]
    scripts:
      pre_run: npm install
      run: node src/index.js
