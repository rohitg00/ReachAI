# Forward-looking. worker-compose ships in the iii alpha channel (validated
# against engine 0.22.1-alpha.13) and is not in a stable release yet, so
# nothing reads this file today. It is here so adopting `iii compose` later is
# a config change rather than a second migration.
#
#   iii compose --namespace reachai            # daemon, from this directory
#   iii trigger compose::up --namespace reachai file=./worker-compose.yaml
#
# Requires iii-sdk >= 0.23 (namespace-aware). On 0.22.x the worker registers in
# the `default` namespace whatever compose injects, and the daemon rejects it
# with WORKER_IGNORED_NAMESPACE. Until then, config.yaml + docker-compose.yml
# are the working path.
namespace: reachai

containers:
  # Job state for both flows: scopes reachai-jobs, reachai-paidjobs, reachai-spam.
  state:
    worker: package://state
    version: 0.21.6

  # The REST surface every ReachAI route is published on (port 3111).
  http:
    worker: package://http
    version: 0.21.3

  # This directory. The key matches `name:` in iii.worker.yaml, which the
  # format requires for a path:// worker that ships a manifest.
  reachai-backend:
    worker: path://.
    depends_on: [state, http]
    scripts:
      # Compose does not run the manifest's install script, so the dependency
      # install is declared here.
      pre_start: "npm install"
